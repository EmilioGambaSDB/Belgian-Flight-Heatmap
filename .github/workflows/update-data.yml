name: Update flight data

on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC, after OpenSky publishes yesterday's flights
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/build_modelled.py"
      - "scripts/grid.py"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild modelled layers
        run: python3 scripts/build_modelled.py
      - name: Fetch OpenSky tracks
        if: github.event_name != 'push'
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          MAX_RUNTIME_S: "10800"
        run: |
          if [ -z "$OPENSKY_CLIENT_ID" ]; then
            echo "::warning::OPENSKY_CLIENT_ID secret is not set; skipping real flight data."
            exit 0
          fi
          python3 scripts/fetch_opensky.py
      - name: Commit data
        run: |
          git config user.name "flight-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update flight data $(date -u +%Y-%m-%d)"
          git push
